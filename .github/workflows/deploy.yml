name: Deploy SuratSales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suratsales-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -eu
            cd /var/www/suratsales
            test "$(id -un)" = "suratsalesdeploy"
            test "$(git remote get-url origin)" = "https://github.com/sanghvisushil/suratsales_landing_page.git"
            git fetch --prune origin main
            git reset --hard origin/main
            test -f index.html
            echo "SuratSales deployed: $(git rev-parse --short HEAD)"
          '
